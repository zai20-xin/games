<svg xmlns="http://www.w3.org/2000/svg">
<defs><filter id="SUPERFORM" x="-20%" y="-20%" width="140%" height="140%"><feColorMatrix type="matrix" values="1.12 0 0 0 0 0 1.12 0 0 0 0 0 1.12 0 0 0 0 0 1 0"/><feColorMatrix type="saturate" values="1.25"/></filter></defs>
<g transform="translate(80 90) scale(1.12) translate(-80 -90)" filter="url(#SUPERFORM)">

  <defs>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a6b35"/>
      <stop offset="0.5" stop-color="#6a994e"/>
      <stop offset="1" stop-color="#386641"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f772d"/>
      <stop offset="1" stop-color="#90a955"/>
    </linearGradient>
    <radialGradient id="petalG" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#cfe3c8"/>
      <stop offset="0.28" stop-color="#f4f7ec"/>
      <stop offset="0.75" stop-color="#fdfcf7"/>
      <stop offset="1" stop-color="#fffef9"/>
    </radialGradient>
    <radialGradient id="coronaG" cx="0.42" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.5" stop-color="#ffcf3f"/>
      <stop offset="0.85" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb8500"/>
    </radialGradient>
    <radialGradient id="coronaIn" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#f4a300"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c1a0d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2c1a0d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="80" cy="168" rx="32" ry="7" fill="url(#shadowG)"/>

  <!-- 带状基生叶（两片弯垂） -->
  <path d="M76 168 C66 138 62 106 70 84 C74 104 76 138 80 168 Z" fill="url(#leafG)"/>
  <path d="M80 168 C88 140 92 112 88 92 C84 112 82 140 82.5 168 Z" fill="url(#leafG)" opacity="0.9"/>
  <path d="M68 92 L72 92 M88 100 L90 100" stroke="#4f772d" stroke-width="0.8" opacity="0.4"/>

  <!-- 花茎（挺直） -->
  <path d="M79 100 C78.5 124 80 146 80 168 L82 168 C82 146 81.5 124 81 100 Z" fill="url(#stemG)"/>

  <!-- 花头（低头 14°） -->
  <g transform="rotate(14 80 88) translate(80 66)">
    <!-- 花被片（银台） -->
    <g fill="url(#petalG)" stroke="#e5e0cf" stroke-opacity="0.7" stroke-width="0.8">
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(0)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(60)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(120)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(180)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(240)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(300)"/>
    </g>
    <!-- 副冠（金盏）外缘 -->
    <circle r="15" fill="url(#coronaG)"/>
    <g fill="url(#coronaG)">
      <circle cx="0" cy="-15" r="3"/>
      <circle cx="10.6" cy="-10.6" r="3"/>
      <circle cx="15" cy="0" r="3"/>
      <circle cx="10.6" cy="10.6" r="3"/>
      <circle cx="0" cy="15" r="3"/>
      <circle cx="-10.6" cy="10.6" r="3"/>
      <circle cx="-15" cy="0" r="3"/>
      <circle cx="-10.6" cy="-10.6" r="3"/>
    </g>
    <!-- 副冠内壁 -->
    <circle r="11" fill="url(#coronaIn)"/>
    <circle r="11" fill="none" stroke="#e08e00" stroke-width="1" opacity="0.5"/>
    <!-- 冠内花蕊 -->
    <circle r="5" fill="#f4a300" opacity="0.85"/>
    <g fill="#c97700" opacity="0.8">
      <circle cx="0" cy="2" r="0.9"/>
      <circle cx="2" cy="0" r="0.9"/>
      <circle cx="-2" cy="0" r="0.9"/>
      <circle cx="0" cy="-2" r="0.9"/>
    </g>
    <!-- 花瓣受光 -->
    <ellipse cx="-13" cy="-16" rx="10" ry="24" fill="#ffffff" opacity="0.28" transform="rotate(-24)"/>
    <ellipse cx="13" cy="-16" rx="10" ry="24" fill="#ffffff" opacity="0.2" transform="rotate(24)"/>
    <!-- 副冠高光 -->
    <ellipse cx="-5" cy="-6" rx="5" ry="3.5" fill="#fff3b0" opacity="0.7"/>
  </g>

  <!-- 小花苞 -->
  <g transform="translate(63 108) rotate(-18)">
    <path d="M0 0 C-5 -6 -6 -16 -3 -24 C-1 -27 1 -27 3 -24 C6 -16 5 -6 0 0 Z" fill="#e9f0e2" stroke="#d5dec9" stroke-width="0.7"/>
    <path d="M0 0 L0 -18" stroke="#cfe3c8" stroke-width="1" opacity="0.8"/>
    <path d="M-4 0 C-5 8 -4 14 -2 20 L2 20 C4 14 5 8 4 0 Z" fill="#6a994e"/>
  </g>

</g>
</svg>