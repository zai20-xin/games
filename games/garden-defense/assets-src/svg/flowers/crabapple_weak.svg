<svg xmlns="http://www.w3.org/2000/svg">
<defs><filter id="WEAKFORM" x="-20%" y="-20%" width="140%" height="140%"><feColorMatrix type="matrix" values="0.55 0.3 0.15 0 0 0.55 0.3 0.15 0 0 0.55 0.3 0.15 0 0 0 0 0 1 0"/><feColorMatrix type="matrix" values="0.82 0 0 0 0 0 0.82 0 0 0 0 0 0.82 0 0 0 0 0 1 0"/></filter></defs>
<g transform="translate(80 90) scale(0.9) rotate(-5) translate(-80 -90)" filter="url(#WEAKFORM)">

  <defs>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3b3e"/>
      <stop offset="0.5" stop-color="#a63d40"/>
      <stop offset="1" stop-color="#7a2e31"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6b42"/>
      <stop offset="1" stop-color="#588157"/>
    </linearGradient>
    <radialGradient id="petalG" cx="0.5" cy="0.92" r="1.05">
      <stop offset="0" stop-color="#e75480"/>
      <stop offset="0.22" stop-color="#ff9ebb"/>
      <stop offset="0.62" stop-color="#ffd7e4"/>
      <stop offset="1" stop-color="#fff3f7"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c1a0d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2c1a0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheenG" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="80" cy="168" rx="27" ry="7" fill="url(#shadowG)"/>

  <!-- 花梗（红褐细梗） -->
  <path d="M78.5 106 C77 128 79 148 78 168 L81.5 168 C80.5 148 82.5 128 81.5 106 Z" fill="url(#stemG)"/>

  <!-- 嫩叶两枚 -->
  <path d="M79 132 C70 128 60 128 54 134 C60 141 71 141 79 137 Z" fill="url(#leafG)"/>
  <path d="M79 133 L56 133.5" stroke="#33523a" stroke-width="0.8" opacity="0.5"/>
  <path d="M80 146 C89 142 99 143 105 149 C99 156 88 156 80 151 Z" fill="url(#leafG)" opacity="0.92"/>
  <path d="M80 147.5 L102 148.5" stroke="#33523a" stroke-width="0.8" opacity="0.5"/>

  <!-- 花萼 -->
  <g transform="translate(80 102)" fill="#b23a48">
    <path d="M0 0 C-6 -3 -9 -8 -10 -15 C-5 -10 -2 -5 0 -2 Z"/>
    <path d="M0 0 C6 -3 9 -8 10 -15 C5 -10 2 -5 0 -2 Z"/>
  </g>

  <!-- 花头：5 圆瓣 -->
  <g transform="translate(80 72)">
    <g fill="url(#petalG)" stroke="#f191ae" stroke-opacity="0.4" stroke-width="0.8">
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(-90)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(-18)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(54)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(126)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(198)"/>
    </g>
    <!-- 瓣基红斑 -->
    <g fill="#e75480" opacity="0.25">
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(-90)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(-18)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(54)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(126)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(198)"/>
    </g>
    <!-- 雄蕊群（金色花药放射） -->
    <g stroke="#e0537d" stroke-width="1.3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(-90)"/>
      <line x1="0" y1="0" x2="0" y2="-21" transform="rotate(-58)"/>
      <line x1="0" y1="0" x2="0" y2="-21" transform="rotate(-26)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(6)"/>
      <line x1="0" y1="0" x2="0" y2="-21" transform="rotate(38)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(70)"/>
      <line x1="0" y1="0" x2="0" y2="-21" transform="rotate(102)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(134)"/>
      <line x1="0" y1="0" x2="0" y2="-21" transform="rotate(166)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(198)"/>
    </g>
    <g fill="#ffc300" stroke="#d99a00" stroke-width="0.5">
      <circle cx="0" cy="-20" r="2.4" transform="rotate(-90)"/>
      <circle cx="0" cy="-21" r="2.4" transform="rotate(-58)"/>
      <circle cx="0" cy="-21" r="2.4" transform="rotate(-26)"/>
      <circle cx="0" cy="-20" r="2.4" transform="rotate(6)"/>
      <circle cx="0" cy="-21" r="2.4" transform="rotate(38)"/>
      <circle cx="0" cy="-20" r="2.4" transform="rotate(70)"/>
      <circle cx="0" cy="-21" r="2.4" transform="rotate(102)"/>
      <circle cx="0" cy="-20" r="2.4" transform="rotate(134)"/>
      <circle cx="0" cy="-21" r="2.4" transform="rotate(166)"/>
      <circle cx="0" cy="-20" r="2.4" transform="rotate(198)"/>
    </g>
    <!-- 雌蕊 -->
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#8fae5d" stroke-width="1.6"/>
    <circle cx="0" cy="-9.5" r="2.2" fill="#b5cc8a" stroke="#6f8f4a" stroke-width="0.6"/>
    <!-- 顶部受光 -->
    <ellipse cx="-8" cy="-12" rx="22" ry="18" fill="url(#sheenG)"/>
  </g>

</g>
</svg>