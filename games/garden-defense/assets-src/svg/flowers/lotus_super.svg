<svg xmlns="http://www.w3.org/2000/svg">
<defs><filter id="SUPERFORM" x="-20%" y="-20%" width="140%" height="140%"><feColorMatrix type="matrix" values="1.12 0 0 0 0 0 1.12 0 0 0 0 0 1.12 0 0 0 0 0 1 0"/><feColorMatrix type="saturate" values="1.25"/></filter></defs>
<g transform="translate(80 90) scale(1.12) translate(-80 -90)" filter="url(#SUPERFORM)">

  <defs>
    <linearGradient id="padG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52b788"/>
      <stop offset="1" stop-color="#2d6a4f"/>
    </linearGradient>
    <radialGradient id="lOuter" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#e75480"/>
      <stop offset="0.3" stop-color="#ff8fab"/>
      <stop offset="0.7" stop-color="#ffc2d4"/>
      <stop offset="1" stop-color="#fff0f5"/>
    </radialGradient>
    <radialGradient id="lInner" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#ff9ebb"/>
      <stop offset="0.45" stop-color="#ffd7e4"/>
      <stop offset="1" stop-color="#fffdfe"/>
    </radialGradient>
    <radialGradient id="recepG" cx="0.42" cy="0.38" r="0.9">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.6" stop-color="#ffc300"/>
      <stop offset="1" stop-color="#e0a100"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e2a1a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0e2a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheenG" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 莲叶（水面投影 + 放射脉） -->
  <ellipse cx="80" cy="152" rx="34" ry="10" fill="url(#shadowG)"/>
  <ellipse cx="80" cy="149" rx="32" ry="10" fill="url(#padG)"/>
  <ellipse cx="80" cy="149" rx="32" ry="10" fill="none" stroke="#1b4332" stroke-width="1.2" opacity="0.55"/>
  <g stroke="#1b4332" stroke-width="0.8" opacity="0.35">
    <path d="M80 149 L55 143"/>
    <path d="M80 149 L105 143"/>
    <path d="M80 149 L48 151"/>
    <path d="M80 149 L112 151"/>
    <path d="M80 149 L60 157"/>
    <path d="M80 149 L100 157"/>
  </g>
  <ellipse cx="68" cy="146" rx="9" ry="2.5" fill="#95d5b2" opacity="0.35"/>

  <!-- 花茎（从莲心抽出） -->
  <path d="M78.5 100 C77 118 79 134 78 148 L82 148 C81 134 83 118 81.5 100 Z" fill="#2d6a4f"/>

  <!-- 花头：外八内六 -->
  <g transform="translate(80 64)">
    <!-- 外层八瓣（舒展） -->
    <g fill="url(#lOuter)" stroke="#e75480" stroke-opacity="0.35" stroke-width="0.8">
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(15) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(60) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(105) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(150) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(195) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(240) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(285) scale(0.98)"/>
      <path d="M0 0 C-11 -12 -14 -36 -7 -52 C-3 -58 3 -58 7 -52 C14 -36 11 -12 0 0 Z" transform="rotate(330) scale(0.98)"/>
    </g>
    <!-- 内层六瓣（收拢） -->
    <g fill="url(#lInner)" stroke="#f191ae" stroke-opacity="0.3" stroke-width="0.7">
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(38) scale(0.82)"/>
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(98) scale(0.82)"/>
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(158) scale(0.82)"/>
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(218) scale(0.82)"/>
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(278) scale(0.82)"/>
      <path d="M0 0 C-10 -11 -12 -32 -6 -46 C-3 -51 3 -51 6 -46 C12 -32 10 -11 0 0 Z" transform="rotate(338) scale(0.82)"/>
    </g>
    <!-- 雄蕊环 -->
    <g stroke="#e0a100" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(0)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(45)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(90)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(135)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(180)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(225)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(270)"/>
      <line x1="0" y1="-4" x2="0" y2="-11" transform="rotate(315)"/>
    </g>
    <!-- 莲蓬 -->
    <circle r="6.5" fill="url(#recepG)"/>
    <g fill="#b07d00" opacity="0.85">
      <circle cx="0" cy="-2.2" r="1"/>
      <circle cx="2" cy="-0.8" r="1"/>
      <circle cx="-2" cy="-0.8" r="1"/>
      <circle cx="0" cy="1.4" r="1"/>
      <circle cx="2.6" cy="1.6" r="0.8"/>
      <circle cx="-2.6" cy="1.6" r="0.8"/>
    </g>
    <!-- 顶部受光 -->
    <ellipse cx="-8" cy="-13" rx="20" ry="16" fill="url(#sheenG)"/>
  </g>

  <!-- 水面涟漪 -->
  <ellipse cx="80" cy="156" rx="42" ry="6" fill="none" stroke="#95d5b2" stroke-width="1" opacity="0.3"/>

</g>
</svg>