<svg width="160" height="180" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a5a40"/>
      <stop offset="0.5" stop-color="#588157"/>
      <stop offset="1" stop-color="#3a5a40"/>
    </linearGradient>
    <!-- 素心兰：无斑纯色，玉素雅淡 -->
    <radialGradient id="sepalG" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#9dc9a5"/>
      <stop offset="0.4" stop-color="#c8e6cd"/>
      <stop offset="0.8" stop-color="#e8f6ea"/>
      <stop offset="1" stop-color="#f6fcf6"/>
    </radialGradient>
    <radialGradient id="petalG" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#aacfaf"/>
      <stop offset="0.45" stop-color="#d4ebd7"/>
      <stop offset="1" stop-color="#f0faf1"/>
    </radialGradient>
    <linearGradient id="lipG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefce8"/>
      <stop offset="0.6" stop-color="#fdf9e3"/>
      <stop offset="1" stop-color="#f7efd0"/>
    </linearGradient>
    <radialGradient id="colG" cx="0.4" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="1" stop-color="#ffe066"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c1a0d" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2c1a0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ad1ff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#9ad1ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#9ad1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="80" cy="168" rx="30" ry="7" fill="url(#shadowG)"/>

  <!-- 剑形叶 -->
  <path d="M78 168 C62 132 58 96 70 66" fill="none" stroke="#4f772d" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M78 168 C62 132 58 96 70 66" fill="none" stroke="#6a994e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M81 168 C96 136 100 104 92 78" fill="none" stroke="#588157" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 168 C76 146 76 126 82 108" fill="none" stroke="#3a5a40" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 花茎 -->
  <path d="M79 120 C77 136 78.5 152 78 166 L81.5 166 C81 152 82.5 136 81 120 Z" fill="url(#stemG)"/>

  <!-- 珍稀光晕 -->
  <circle cx="80" cy="78" r="50" fill="url(#auraG)"/>

  <!-- 花头：素心（无斑） -->
  <g transform="translate(80 78)">
    <path d="M0 2 C-9 -10 -11 -34 -5 -50 C-2 -57 2 -57 5 -50 C11 -34 9 -10 0 2 Z" fill="url(#sepalG)" stroke="#b0cfb4" stroke-opacity="0.5" stroke-width="0.7" transform="rotate(6)"/>
    <path d="M0 2 C-9 -10 -11 -34 -5 -50 C-2 -57 2 -57 5 -50 C11 -34 9 -10 0 2 Z" fill="url(#sepalG)" stroke="#b0cfb4" stroke-opacity="0.5" stroke-width="0.7" transform="rotate(-52) scale(0.96)"/>
    <path d="M0 2 C-9 -10 -11 -34 -5 -50 C-2 -57 2 -57 5 -50 C11 -34 9 -10 0 2 Z" fill="url(#sepalG)" stroke="#b0cfb4" stroke-opacity="0.5" stroke-width="0.7" transform="rotate(64) scale(0.96)"/>
    <!-- 捧瓣（纯净无斑） -->
    <g transform="rotate(-24) scale(0.72)">
      <path d="M0 0 C-11 -8 -14 -28 -7 -42 C-3 -48 3 -48 7 -42 C14 -28 11 -8 0 0 Z" fill="url(#petalG)" stroke="#c2ddc6" stroke-opacity="0.55" stroke-width="0.7"/>
    </g>
    <g transform="rotate(36) scale(0.72)">
      <path d="M0 0 C-11 -8 -14 -28 -7 -42 C-3 -48 3 -48 7 -42 C14 -28 11 -8 0 0 Z" fill="url(#petalG)" stroke="#c2ddc6" stroke-opacity="0.55" stroke-width="0.7"/>
    </g>
    <!-- 素唇（一尘不染） -->
    <path d="M0 -2 C-12 -4 -17 6 -12 16 C-8 24 -2 28 0 30 C2 28 8 24 12 16 C17 6 12 -4 0 -2 Z" fill="url(#lipG)" stroke="#e3d9ac" stroke-opacity="0.6" stroke-width="0.7"/>
    <path d="M0 -2 C-9 2 -10 12 -6 20 C-3 25 -1 27 0 28" fill="none" stroke="#d8ce9c" stroke-width="0.8" opacity="0.45"/>
    <path d="M0 -2 C9 2 10 12 6 20 C3 25 1 27 0 28" fill="none" stroke="#d8ce9c" stroke-width="0.8" opacity="0.45"/>
    <!-- 蕊柱 -->
    <path d="M-4 -6 C-5 0 -3 4 0 5 C3 4 5 0 4 -6 C2 -9 -2 -9 -4 -6 Z" fill="url(#colG)" stroke="#e0c235" stroke-width="0.6"/>
    <circle cx="0" cy="-4" r="1.6" fill="#fff8d6"/>
  </g>
</svg>
