<svg width="160" height="180" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a6b35"/>
      <stop offset="0.5" stop-color="#6a994e"/>
      <stop offset="1" stop-color="#386641"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f772d"/>
      <stop offset="1" stop-color="#90a955"/>
    </linearGradient>
    <!-- 凌波仙子：银白泛蓝光花被 -->
    <radialGradient id="petalG" cx="0.5" cy="0.95" r="1.1">
      <stop offset="0" stop-color="#d3e2f0"/>
      <stop offset="0.3" stop-color="#f0f6fb"/>
      <stop offset="0.75" stop-color="#fbfdfe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <radialGradient id="coronaG" cx="0.42" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#ffe985"/>
      <stop offset="0.5" stop-color="#ffd60a"/>
      <stop offset="0.85" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb8500"/>
    </radialGradient>
    <radialGradient id="coronaIn" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#f4a300"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14303f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14303f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffd700" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影（水面） -->
  <ellipse cx="80" cy="166" rx="36" ry="8" fill="url(#shadowG)"/>

  <!-- 带状叶 -->
  <path d="M76 168 C66 138 62 106 70 84 C74 104 76 138 80 168 Z" fill="url(#leafG)"/>
  <path d="M80 168 C88 140 92 112 88 92 C84 112 82 140 82.5 168 Z" fill="url(#leafG)" opacity="0.9"/>

  <!-- 花茎 -->
  <path d="M79 100 C78.5 124 80 146 80 168 L82 168 C82 146 81.5 124 81 100 Z" fill="url(#stemG)"/>

  <!-- 名贵金晕 -->
  <circle cx="80" cy="64" r="58" fill="url(#auraG)"/>

  <!-- 花头（凌波低垂） -->
  <g transform="rotate(16 80 88) translate(80 66)">
    <g fill="url(#petalG)" stroke="#d9e4ee" stroke-opacity="0.75" stroke-width="0.8">
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(0)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(60)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(120)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(180)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(240)"/>
      <path d="M0 0 C-10 -12 -13 -36 -6 -52 C-2.5 -58 2.5 -58 6 -52 C13 -36 10 -12 0 0 Z" transform="rotate(300)"/>
    </g>
    <!-- 流光副冠（金盏镶橙缘） -->
    <circle r="15" fill="url(#coronaG)"/>
    <g fill="url(#coronaG)">
      <circle cx="0" cy="-15" r="3.2"/>
      <circle cx="10.6" cy="-10.6" r="3.2"/>
      <circle cx="15" cy="0" r="3.2"/>
      <circle cx="10.6" cy="10.6" r="3.2"/>
      <circle cx="0" cy="15" r="3.2"/>
      <circle cx="-10.6" cy="10.6" r="3.2"/>
      <circle cx="-15" cy="0" r="3.2"/>
      <circle cx="-10.6" cy="-10.6" r="3.2"/>
    </g>
    <circle r="11" fill="url(#coronaIn)"/>
    <circle r="11" fill="none" stroke="#e08e00" stroke-width="1" opacity="0.55"/>
    <circle r="5" fill="#f4a300" opacity="0.85"/>
    <g fill="#c97700" opacity="0.8">
      <circle cx="0" cy="2" r="0.9"/>
      <circle cx="2" cy="0" r="0.9"/>
      <circle cx="-2" cy="0" r="0.9"/>
      <circle cx="0" cy="-2" r="0.9"/>
    </g>
    <!-- 银白高光 -->
    <ellipse cx="-13" cy="-16" rx="10" ry="24" fill="#ffffff" opacity="0.35" transform="rotate(-24)"/>
    <ellipse cx="13" cy="-16" rx="10" ry="24" fill="#ffffff" opacity="0.25" transform="rotate(24)"/>
    <ellipse cx="-5" cy="-6" rx="5" ry="3.5" fill="#fff8d6" opacity="0.8"/>
  </g>

  <!-- 水光飞溅（凌波意象） -->
  <circle cx="58" cy="150" r="6" fill="url(#sparkG)"/>
  <circle cx="104" cy="158" r="5" fill="url(#sparkG)"/>
  <circle cx="92" cy="144" r="3.5" fill="url(#sparkG)"/>
  <path d="M56 148 C58 144 60 146 59 148 C58.5 149.5 56.5 149.5 56 148 Z" fill="#d6ecff" opacity="0.8"/>
  <path d="M102 156 C104 152 106 154 105 156 C104.5 157.5 102.5 157.5 102 156 Z" fill="#d6ecff" opacity="0.8"/>
</svg>
