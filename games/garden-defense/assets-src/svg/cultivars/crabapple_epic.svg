<svg width="160" height="180" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3b3e"/>
      <stop offset="0.5" stop-color="#a63d40"/>
      <stop offset="1" stop-color="#7a2e31"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6b42"/>
      <stop offset="1" stop-color="#588157"/>
    </linearGradient>
    <!-- 垂丝海棠：绛红深粉 -->
    <radialGradient id="petalG" cx="0.5" cy="0.92" r="1.05">
      <stop offset="0" stop-color="#ad1457"/>
      <stop offset="0.25" stop-color="#e75480"/>
      <stop offset="0.65" stop-color="#ff9ebb"/>
      <stop offset="1" stop-color="#ffe3ee"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c1a0d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2c1a0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ad1ff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#9ad1ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#9ad1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheenG" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="80" cy="168" rx="27" ry="7" fill="url(#shadowG)"/>

  <!-- 主茎 -->
  <path d="M78.5 106 C77 128 79 148 78 168 L81.5 168 C80.5 148 82.5 128 81.5 106 Z" fill="url(#stemG)"/>

  <!-- 嫩叶 -->
  <path d="M79 134 C70 130 60 130 54 136 C60 143 71 143 79 139 Z" fill="url(#leafG)"/>
  <path d="M80 148 C89 144 99 145 105 151 C99 158 88 158 80 153 Z" fill="url(#leafG)" opacity="0.92"/>

  <!-- 垂丝花梗（细长弧垂） -->
  <path d="M80 108 C92 96 106 84 112 70" fill="none" stroke="#a63d40" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 108 C92 96 106 84 112 70" fill="none" stroke="#c96b6e" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- 珍稀光晕 -->
  <circle cx="112" cy="56" r="44" fill="url(#auraG)"/>

  <!-- 悬垂花头（下垂 40°） -->
  <g transform="translate(112 56) rotate(40)">
    <!-- 花萼 -->
    <g transform="translate(0 30)" fill="#b23a48">
      <path d="M0 0 C-6 -2 -9 -7 -10 -14 C-5 -9 -2 -5 0 -2 Z"/>
      <path d="M0 0 C6 -2 9 -7 10 -14 C5 -9 2 -5 0 -2 Z"/>
    </g>
    <g fill="url(#petalG)" stroke="#d61f69" stroke-opacity="0.4" stroke-width="0.8">
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(-90)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(-18)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(54)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(126)"/>
      <path d="M0 0 C-22 -8 -30 -30 -19 -48 C-10 -62 10 -62 19 -48 C30 -30 22 -8 0 0 Z" transform="rotate(198)"/>
    </g>
    <g fill="#ad1457" opacity="0.25">
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(-90)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(-18)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(54)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(126)"/>
      <ellipse cx="0" cy="-14" rx="8" ry="12" transform="rotate(198)"/>
    </g>
    <!-- 雄蕊 -->
    <g stroke="#e0537d" stroke-width="1.3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(-72)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(-36)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(0)"/>
      <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(36)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(72)"/>
      <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(108)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(144)"/>
      <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-20" transform="rotate(216)"/>
      <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(252)"/>
    </g>
    <g fill="#ffc300" stroke="#d99a00" stroke-width="0.5">
      <circle cx="0" cy="-19" r="2.3" transform="rotate(-72)"/>
      <circle cx="0" cy="-20" r="2.3" transform="rotate(-36)"/>
      <circle cx="0" cy="-20" r="2.3" transform="rotate(0)"/>
      <circle cx="0" cy="-19" r="2.3" transform="rotate(36)"/>
      <circle cx="0" cy="-20" r="2.3" transform="rotate(72)"/>
      <circle cx="0" cy="-19" r="2.3" transform="rotate(108)"/>
      <circle cx="0" cy="-20" r="2.3" transform="rotate(144)"/>
      <circle cx="0" cy="-19" r="2.3" transform="rotate(180)"/>
      <circle cx="0" cy="-20" r="2.3" transform="rotate(216)"/>
      <circle cx="0" cy="-19" r="2.3" transform="rotate(252)"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#8fae5d" stroke-width="1.6"/>
    <circle cx="0" cy="-9.5" r="2.2" fill="#b5cc8a" stroke="#6f8f4a" stroke-width="0.6"/>
    <ellipse cx="-8" cy="-12" rx="22" ry="18" fill="url(#sheenG)"/>
  </g>

  <!-- 侧枝小花苞 -->
  <g transform="translate(66 120)">
    <path d="M0 8 C-2 2 -2 -4 0 -10 C2 -4 2 2 0 8 Z" fill="#c94f7c"/>
    <circle cx="0" cy="-12" r="4.5" fill="#e75480"/>
    <circle cx="0" cy="-12" r="4.5" fill="none" stroke="#ad1457" stroke-width="0.8" opacity="0.5"/>
    <path d="M0 8 C-6 10 -10 14 -12 18" fill="none" stroke="#a63d40" stroke-width="1.5"/>
  </g>
</svg>
