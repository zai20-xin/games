<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#ffd95e"/>
      <stop offset="55%" stop-color="#e0a22e"/>
      <stop offset="100%" stop-color="#9c6b10"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3bf"/>
      <stop offset="60%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffb320"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd94d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b84e"/>
      <stop offset="100%" stop-color="#b5792b"/>
    </linearGradient>
  </defs>

  <!-- 金光晕 -->
  <circle cx="58" cy="56" r="40" fill="url(#halo)"/>

  <!-- 金色茎 -->
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#4a3a18" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#c9a04a" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 金叶 -->
  <g stroke="#4a3a18" stroke-width="4">
    <ellipse cx="39" cy="113" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(-22 39 113)"/>
    <ellipse cx="77" cy="110" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(16 77 110)"/>
  </g>

  <!-- 王冠 -->
  <g fill="#ffd94d" stroke="#7a5510" stroke-width="3" stroke-linejoin="round">
    <path d="M39 26 L43 12 L49 21 L55 9 L61 21 L67 12 L71 26 Z"/>
  </g>
  <g fill="#ffefca">
    <circle cx="43" cy="18" r="2.4"/>
    <circle cx="55" cy="15" r="2.4"/>
    <circle cx="67" cy="18" r="2.4"/>
  </g>

  <!-- 顶芽 -->
  <path d="M52 34 C 52 22 58 16 66 15" stroke="#4a3a18" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M52 34 C 52 22 58 16 66 15" stroke="#c9a04a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="70" cy="15.5" rx="7" ry="4.5" fill="url(#leaf)" stroke="#4a3a18" stroke-width="3.5" transform="rotate(18 70 15.5)"/>

  <!-- 三管：金色能量炮 -->
  <g stroke="#4a3a18" stroke-width="4.5" stroke-linejoin="round">
    <rect x="58" y="20" width="50" height="18" rx="9" fill="url(#head)"/>
    <rect x="48" y="44" width="60" height="18" rx="9" fill="url(#head)"/>
    <rect x="58" y="68" width="50" height="18" rx="9" fill="url(#head)"/>
    <rect x="60" y="22" width="44" height="3.5" rx="2" fill="#ffe9a8" opacity="0.7"/>
    <rect x="50" y="46" width="54" height="3.5" rx="2" fill="#ffe9a8" opacity="0.7"/>
    <rect x="60" y="70" width="44" height="3.5" rx="2" fill="#ffe9a8" opacity="0.7"/>
    <ellipse cx="106" cy="29" rx="6" ry="9.5" fill="#5c3c08"/>
    <ellipse cx="106" cy="53" rx="6" ry="9.5" fill="#5c3c08"/>
    <ellipse cx="106" cy="77" rx="6" ry="9.5" fill="#5c3c08"/>
  </g>
  <!-- 金镶环 -->
  <g fill="none" stroke="#ffe9a8" stroke-width="2.5">
    <circle cx="100" cy="29" r="7"/><circle cx="100" cy="53" r="7"/><circle cx="100" cy="77" r="7"/>
  </g>

  <!-- 连接基座 -->
  <rect x="40" y="38" width="18" height="46" rx="6" fill="#e0a22e" stroke="#4a3a18" stroke-width="4"/>

  <!-- 头部金甲 -->
  <circle cx="40" cy="56" r="24" fill="url(#head)" stroke="#4a3a18" stroke-width="4.5"/>
  <circle cx="40" cy="56" r="24" fill="none" stroke="#ffe9a8" stroke-width="1.5" opacity="0.7" stroke-dasharray="3 4"/>

  <!-- 能量核心眼 -->
  <g>
    <circle cx="33" cy="48" r="6.4" fill="#fff3bf"/>
    <circle cx="48" cy="46" r="5.6" fill="#fff3bf"/>
    <circle cx="34.8" cy="49" r="2.6" fill="url(#core)"/>
    <circle cx="49.6" cy="47.5" r="2.4" fill="url(#core)"/>
    <circle cx="34" cy="48" r="1" fill="#ffffff"/>
    <circle cx="49" cy="46.8" r="0.9" fill="#ffffff"/>
  </g>
  <path d="M30 67 Q 39 71 47 68" stroke="#4a3a18" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>