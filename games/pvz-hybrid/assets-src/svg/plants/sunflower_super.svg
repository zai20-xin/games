<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="petal" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffed9e"/>
      <stop offset="100%" stop-color="#ffc73a"/>
    </radialGradient>
    <radialGradient id="disc" cx="40%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#d8a33c"/>
      <stop offset="100%" stop-color="#8a5e0c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd94d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c05a"/>
      <stop offset="100%" stop-color="#b07a1c"/>
    </linearGradient>
  </defs>

  <!-- 光晕 -->
  <circle cx="64" cy="46" r="38" fill="url(#halo)"/>

  <!-- stem -->
  <path d="M64 80 C 61 96 67 104 63 121" stroke="#4a3a18" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M64 80 C 61 96 67 104 63 121" stroke="#d9b13c" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- leaves（金叶） -->
  <g stroke="#4a3a18" stroke-width="4">
    <ellipse cx="44" cy="110" rx="15" ry="7" fill="url(#leaf)" transform="rotate(-24 44 110)"/>
    <ellipse cx="84" cy="107" rx="15" ry="7" fill="url(#leaf)" transform="rotate(18 84 107)"/>
  </g>

  <!-- 王冠 -->
  <g fill="#ffd94d" stroke="#7a5510" stroke-width="3" stroke-linejoin="round">
    <path d="M49 15 L53 1 L59 10 L64 0 L69 10 L75 1 L79 15 Z"/>
  </g>
  <g fill="#ffefca">
    <circle cx="53" cy="6" r="2.4"/>
    <circle cx="64" cy="3" r="2.4"/>
    <circle cx="75" cy="6" r="2.4"/>
  </g>

  <!-- petals（双层向阳瓣） -->
  <g stroke="#4a3a18" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(30 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(60 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(90 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(120 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(150 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(180 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(210 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(240 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(270 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(300 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(330 64 54)"/>
  </g>

  <!-- 金质点盘面 -->
  <circle cx="64" cy="54" r="25.5" fill="url(#disc)" stroke="#4a3a18" stroke-width="4.5"/>
  <g fill="#ffe9a8" opacity="0.85">
    <circle cx="52" cy="52" r="1.6"/>
    <circle cx="60" cy="46" r="1.6"/>
    <circle cx="70" cy="45" r="1.6"/>
    <circle cx="76" cy="53" r="1.6"/>
    <circle cx="52" cy="60" r="1.6"/>
    <circle cx="60" cy="64" r="1.6"/>
    <circle cx="70" cy="63" r="1.6"/>
    <circle cx="76" cy="59" r="1.6"/>
    <circle cx="64" cy="57" r="1.6"/>
  </g>
  <circle cx="56" cy="48" r="3.2" fill="#20120a"/>
  <circle cx="72" cy="48" r="3.2" fill="#20120a"/>
  <circle cx="57" cy="47" r="1" fill="#fff"/>
  <circle cx="73" cy="47" r="1" fill="#fff"/>
  <path d="M53 59 Q 64 71 75 59 Q 64 65 53 59 Z" fill="#42300c" stroke="#4a3a18" stroke-width="2.5" stroke-linejoin="round"/>
</svg>