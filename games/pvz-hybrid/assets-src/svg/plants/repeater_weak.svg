<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="40%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#aebaa6"/>
      <stop offset="55%" stop-color="#8d9b86"/>
      <stop offset="100%" stop-color="#6d7a66"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9a88"/>
      <stop offset="100%" stop-color="#7a7a6a"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a03c34"/>
      <stop offset="100%" stop-color="#6b221c"/>
    </linearGradient>
  </defs>

  <!-- 枯萎垂软茎 -->
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#3d3a30" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#7d7d6c" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 焦叶下垂 -->
  <g stroke="#3d3a30" stroke-width="4">
    <ellipse cx="36" cy="117" rx="13" ry="5" fill="url(#leaf)" transform="rotate(74 36 117)"/>
    <ellipse cx="80" cy="118" rx="13" ry="5" fill="url(#leaf)" transform="rotate(112 80 118)"/>
  </g>
  <circle cx="31" cy="113" r="3" fill="#5a5640" opacity="0.7"/>
  <circle cx="77" cy="114" r="2.6" fill="#5a5640" opacity="0.7"/>

  <!-- 倒伏顶芽 -->
  <path d="M54 42 C 46 28 54 18 64 14" stroke="#3d3a30" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M54 42 C 46 28 54 18 64 14" stroke="#84846f" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- 衰竭下垂双管（枪口朝地，发黑） -->
  <g stroke="#3d3a30" stroke-width="4.5" stroke-linejoin="round">
    <rect x="52" y="40" width="46" height="19" rx="9.5" fill="url(#pipe)" transform="rotate(30 75 49)"/>
    <rect x="44" y="66" width="52" height="19" rx="9.5" fill="url(#pipe)" transform="rotate(42 70 75)"/>
    <ellipse cx="66" cy="64" rx="6" ry="10" fill="#3a1814" transform="rotate(30 66 64)"/>
    <ellipse cx="60" cy="92" rx="6" ry="10" fill="#3a1814" transform="rotate(42 60 92)"/>
  </g>

  <!-- 塌垂头座 -->
  <circle cx="46" cy="74" r="29" fill="url(#head)" stroke="#3d3a30" stroke-width="4.5" transform="rotate(20 46 74)"/>
  <path d="M31 88 C 40 95 52 97 62 91" stroke="#56533f" stroke-width="2.2" fill="none"/>
  <path d="M36 58 C 41 52 47 54 50 59" stroke="#56533f" stroke-width="2.2" fill="none"/>

  <!-- 昏沉眼 -->
  <g fill="#e6e2ce" stroke="#3d3a30" stroke-width="3">
    <ellipse cx="38" cy="70" rx="4.8" ry="6.2"/>
    <ellipse cx="55" cy="68" rx="4" ry="5.2"/>
  </g>
  <path d="M37 69 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <path d="M54 67 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <!-- 沮丧嘴 -->
  <path d="M40 90 Q 48 88 54 89" stroke="#3d3a30" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>