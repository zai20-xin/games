<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#ffd95e"/>
      <stop offset="55%" stop-color="#e0a22e"/>
      <stop offset="100%" stop-color="#9c6b10"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3bf"/>
      <stop offset="60%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffb320"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd94d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b84e"/>
      <stop offset="100%" stop-color="#b5792b"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a4e"/>
      <stop offset="100%" stop-color="#c22a1f"/>
    </linearGradient>
  </defs>

  <!-- 金光晕 -->
  <circle cx="58" cy="62" r="40" fill="url(#halo)"/>

  <!-- 金色茎 -->
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#4a3a18" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#c9a04a" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 金色叶片 -->
  <g stroke="#4a3a18" stroke-width="4">
    <ellipse cx="39" cy="113" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(-22 39 113)"/>
    <ellipse cx="77" cy="110" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(16 77 110)"/>
  </g>

  <!-- 王冠 -->
  <g fill="#ffd94d" stroke="#7a5510" stroke-width="3" stroke-linejoin="round">
    <path d="M37 22 L41 8 L47 17 L53 5 L59 17 L65 8 L69 22 Z"/>
  </g>
  <g fill="#ffefca">
    <circle cx="41" cy="14" r="2.4"/>
    <circle cx="53" cy="11" r="2.4"/>
    <circle cx="65" cy="14" r="2.4"/>
  </g>

  <!-- 顶芽 -->
  <path d="M52 32 C 52 20 58 14 66 13" stroke="#4a3a18" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M52 32 C 52 20 58 14 66 13" stroke="#c9a04a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="70" cy="13.5" rx="7" ry="4.5" fill="url(#leaf)" stroke="#4a3a18" stroke-width="3.5" transform="rotate(18 70 13.5)"/>

  <!-- 双炮管：金红双管带金边 -->
  <g stroke="#4a3a18" stroke-width="4.5" stroke-linejoin="round">
    <rect x="56" y="32" width="52" height="20" rx="10" fill="url(#pipe)"/>
    <rect x="48" y="56" width="56" height="20" rx="10" fill="url(#pipe)"/>
    <rect x="58.5" y="34.5" width="46" height="4" rx="2" fill="#ffb9b0" opacity="0.7"/>
    <rect x="50.5" y="58.5" width="50" height="4" rx="2" fill="#ffb9b0" opacity="0.7"/>
    <ellipse cx="102" cy="42" rx="6.5" ry="10.5" fill="#5c1010"/>
    <ellipse cx="102" cy="66" rx="6.5" ry="10.5" fill="#5c1010"/>
  </g>

  <!-- 连接座 -->
  <circle cx="52" cy="50" r="14" fill="#ffd95e" stroke="#4a3a18" stroke-width="4"/>

  <!-- 头部金甲 -->
  <circle cx="46" cy="62" r="30" fill="url(#head)" stroke="#4a3a18" stroke-width="4.5"/>
  <circle cx="46" cy="62" r="30" fill="none" stroke="#ffe9a8" stroke-width="1.6" opacity="0.7" stroke-dasharray="3 4"/>

  <!-- 能量核心眼 -->
  <g>
    <circle cx="39" cy="52" r="7.5" fill="#fff3bf"/>
    <circle cx="57" cy="50" r="7" fill="#fff3bf"/>
    <circle cx="41" cy="53" r="3.4" fill="url(#core)"/>
    <circle cx="58.6" cy="51.5" r="3.2" fill="url(#core)"/>
    <circle cx="39.5" cy="51.5" r="1.2" fill="#ffffff"/>
    <circle cx="57.5" cy="50" r="1.1" fill="#ffffff"/>
  </g>
  <path d="M37 74 Q 46 78 54 75" stroke="#4a3a18" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>