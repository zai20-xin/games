<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="40%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#c3cbd2"/>
      <stop offset="55%" stop-color="#98a6b0"/>
      <stop offset="100%" stop-color="#6e7b85"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a6b4b8"/>
      <stop offset="100%" stop-color="#7d8c92"/>
    </linearGradient>
  </defs>

  <!-- 冻枯垂软茎 -->
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#3d3a38" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#8b9aa0" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- 茎上霜纹 -->
  <path d="M52 96 L 56 99" stroke="#dde6ea" stroke-width="2" opacity="0.6"/>
  <path d="M62 108 L 66 110" stroke="#dde6ea" stroke-width="2" opacity="0.6"/>

  <!-- 冻卷枯叶 -->
  <g stroke="#3d3a38" stroke-width="4">
    <ellipse cx="36" cy="117" rx="13" ry="5" fill="url(#leaf)" transform="rotate(74 36 117)"/>
    <ellipse cx="80" cy="118" rx="13" ry="5" fill="url(#leaf)" transform="rotate(112 80 118)"/>
  </g>
  <circle cx="31" cy="113" r="3" fill="#5a6066" opacity="0.7"/>
  <circle cx="77" cy="114" r="2.6" fill="#5a6066" opacity="0.7"/>

  <!-- 倒伏顶芽 -->
  <path d="M58 60 C 50 44 62 30 74 27" stroke="#3d3a38" stroke-width="9.5" fill="none" stroke-linecap="round"/>
  <path d="M58 60 C 50 44 62 30 74 27" stroke="#94a3aa" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- 融化的冰晶（消融滴落） -->
  <g fill="#cdd8de" opacity="0.8">
    <path d="M72 34 L 76 41 L 72 48 L 68 41 Z"/>
    <path d="M84 40 L 87 45 L 84 50 L 81 45 Z" opacity="0.6"/>
  </g>

  <!-- 下垂歪炮口 -->
  <g stroke="#3d3a38" stroke-width="4.5" stroke-linejoin="round">
    <rect x="70" y="48" width="38" height="25" rx="13" fill="url(#head)" transform="rotate(24 88 60)"/>
    <ellipse cx="102" cy="73" rx="5.5" ry="12" fill="#51606a" transform="rotate(24 102 73)"/>
  </g>

  <!-- 垂头塌陷 + 冰裂纹 -->
  <circle cx="55" cy="66" r="30" fill="url(#head)" stroke="#3d3a38" stroke-width="4.5" transform="rotate(18 55 66)"/>
  <path d="M38 80 C 47 87 60 90 72 83" stroke="#616c74" stroke-width="2.2" fill="none"/>
  <path d="M44 42 C 49 36 55 38 58 44" stroke="#616c74" stroke-width="2.2" fill="none"/>
  <circle cx="40" cy="62" r="3" fill="#5a6066" opacity="0.55"/>
  <circle cx="72" cy="70" r="2.4" fill="#5a6066" opacity="0.55"/>

  <!-- 昏沉闭眼 -->
  <g fill="#e8eaec" stroke="#3d3a38" stroke-width="3">
    <ellipse cx="48" cy="52" rx="5" ry="6"/>
    <ellipse cx="66" cy="50" rx="4.6" ry="5.6"/>
  </g>
  <path d="M47 51 q 2 -2 -1 -3" stroke="#3d3a38" stroke-width="2.4" fill="none"/>
  <path d="M65 49 q 2 -2 -1 -3" stroke="#3d3a38" stroke-width="2.4" fill="none"/>
  <!-- 沮丧嘴 -->
  <path d="M52 74 Q 59 72 66 73" stroke="#3d3a38" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>