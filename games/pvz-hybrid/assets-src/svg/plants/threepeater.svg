<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#8ed45e"/>
      <stop offset="100%" stop-color="#4c9c28"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83cf52"/>
      <stop offset="100%" stop-color="#4d9627"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#26150a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#5aa63a" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- leaves -->
  <g stroke="#26150a" stroke-width="4">
    <ellipse cx="39" cy="113" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(-22 39 113)"/>
    <ellipse cx="77" cy="110" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(16 77 110)"/>
  </g>

  <!-- top sprout -->
  <path d="M54 30 C 54 18 60 12 68 11" stroke="#26150a" stroke-width="9.5" fill="none" stroke-linecap="round"/>
  <path d="M54 30 C 54 18 60 12 68 11" stroke="#5aa63a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="73" cy="11" rx="7" ry="4.5" fill="url(#leaf)" stroke="#26150a" stroke-width="3.5" transform="rotate(18 73 11)"/>

  <!-- 三炮管：上/中/下三层 -->
  <g stroke="#26150a" stroke-width="4.5" stroke-linejoin="round">
    <rect x="58" y="20" width="50" height="18" rx="9" fill="url(#head)"/>
    <rect x="48" y="44" width="60" height="18" rx="9" fill="url(#head)"/>
    <rect x="58" y="68" width="50" height="18" rx="9" fill="url(#head)"/>
    <ellipse cx="106" cy="29" rx="6" ry="9.5" fill="#1d4511"/>
    <ellipse cx="106" cy="53" rx="6" ry="9.5" fill="#1d4511"/>
    <ellipse cx="106" cy="77" rx="6" ry="9.5" fill="#1d4511"/>
  </g>
  <!-- 三管顶高光 -->
  <rect x="60" y="22" width="44" height="3.5" rx="2" fill="#bff0a8" opacity="0.55"/>
  <rect x="50" y="46" width="54" height="3.5" rx="2" fill="#bff0a8" opacity="0.55"/>
  <rect x="60" y="70" width="44" height="3.5" rx="2" fill="#bff0a8" opacity="0.55"/>

  <!-- 连接基座 -->
  <rect x="40" y="38" width="18" height="46" rx="6" fill="#2a7a1e" stroke="#26150a" stroke-width="4"/>

  <!-- head -->
  <circle cx="40" cy="56" r="24" fill="url(#head)" stroke="#26150a" stroke-width="4.5"/>

  <!-- face（上扬的战斗神情） -->
  <g stroke="#26150a" stroke-width="3">
    <ellipse cx="33" cy="48" rx="4.6" ry="6.4" fill="#ffffff"/>
    <ellipse cx="48" cy="46" rx="4" ry="5.6" fill="#ffffff"/>
  </g>
  <circle cx="34.8" cy="49" r="2.3" fill="#20120a"/>
  <circle cx="49.6" cy="47.5" r="2" fill="#20120a"/>
  <path d="M30 67 Q 39 71 47 68" stroke="#26150a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>