<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="potato" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#cfa065"/>
      <stop offset="100%" stop-color="#8a6132"/>
    </radialGradient>
    <radialGradient id="bulb" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffb0a0"/>
      <stop offset="55%" stop-color="#ee3b28"/>
      <stop offset="100%" stop-color="#9c1206"/>
    </radialGradient>
  </defs>

  <!-- dirt mound -->
  <path d="M16 119 Q 30 100 50 106 Q 64 98 78 106 Q 98 100 112 119 Z"
        fill="#6e4a28" stroke="#26150a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="38" cy="110" r="2.2" fill="#4c3016"/>
  <circle cx="88" cy="111" r="2.2" fill="#4c3016"/>
  <circle cx="63" cy="108" r="2" fill="#4c3016"/>

  <!-- potato body -->
  <path d="M29 94 C 26 74 42 60 64 60 C 86 60 102 74 99 94 C 97.5 106 83 113 64 113 C 45 113 30.5 106 29 94 Z"
        fill="url(#potato)" stroke="#26150a" stroke-width="4.5"/>
  <ellipse cx="46" cy="80" rx="4" ry="2.6" fill="#6e4a26" opacity="0.7" transform="rotate(-12 46 80)"/>
  <ellipse cx="86" cy="92" rx="3.6" ry="2.4" fill="#6e4a26" opacity="0.7" transform="rotate(10 86 92)"/>
  <ellipse cx="60" cy="101" rx="3.2" ry="2.2" fill="#6e4a26" opacity="0.6"/>

  <!-- face: armed & determined -->
  <g stroke="#26150a" stroke-width="3.5">
    <ellipse cx="52" cy="86" rx="6" ry="7" fill="#ffffff"/>
    <ellipse cx="74" cy="86" rx="6" ry="7" fill="#ffffff"/>
  </g>
  <circle cx="53" cy="87.5" r="2.6" fill="#20120a"/>
  <circle cx="73" cy="87.5" r="2.6" fill="#20120a"/>
  <path d="M45 78 L 56 81 M81 78 L 70 81" stroke="#26150a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M55 99 Q 63 103 71 99" stroke="#26150a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- antenna -->
  <path d="M64 60 L 64 42" stroke="#26150a" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M64 60 L 64 42" stroke="#9aa2ad" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="34" r="9" fill="url(#bulb)" stroke="#26150a" stroke-width="3.5"/>
  <circle cx="61" cy="31" r="2.4" fill="#ffd9cf"/>
</svg>
