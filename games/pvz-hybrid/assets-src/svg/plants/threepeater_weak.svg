<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="40%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#b0bca6"/>
      <stop offset="55%" stop-color="#8d9b86"/>
      <stop offset="100%" stop-color="#6d7a66"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9a88"/>
      <stop offset="100%" stop-color="#7a7a6a"/>
    </linearGradient>
  </defs>

  <!-- 枯萎垂软茎 -->
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#3d3a30" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#7d7d6c" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 焦叶下垂 -->
  <g stroke="#3d3a30" stroke-width="4">
    <ellipse cx="36" cy="117" rx="13" ry="5" fill="url(#leaf)" transform="rotate(74 36 117)"/>
    <ellipse cx="80" cy="118" rx="13" ry="5" fill="url(#leaf)" transform="rotate(112 80 118)"/>
  </g>
  <circle cx="31" cy="113" r="3" fill="#5a5640" opacity="0.7"/>
  <circle cx="77" cy="114" r="2.6" fill="#5a5640" opacity="0.7"/>

  <!-- 倒伏顶芽 -->
  <path d="M54 42 C 46 28 54 18 64 14" stroke="#3d3a30" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M54 42 C 46 28 54 18 64 14" stroke="#84846f" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- 衰竭下垂三管 -->
  <g stroke="#3d3a30" stroke-width="4.5" stroke-linejoin="round">
    <rect x="50" y="52" width="54" height="17" rx="8.5" fill="url(#head)" transform="rotate(34 77 60)"/>
    <rect x="42" y="50" width="58" height="17" rx="8.5" fill="url(#head)" transform="rotate(52 71 59)"/>
    <rect x="56" y="44" width="50" height="17" rx="8.5" fill="url(#head)" transform="rotate(18 81 53)"/>
    <ellipse cx="63" cy="70" rx="5.6" ry="9" fill="#55614a" transform="rotate(34 63 70)"/>
    <ellipse cx="60" cy="76" rx="5.6" ry="9" fill="#55614a" transform="rotate(52 60 76)"/>
    <ellipse cx="65" cy="62" rx="5.6" ry="9" fill="#55614a" transform="rotate(18 65 62)"/>
  </g>

  <!-- 塌垂头（含皱纹） -->
  <circle cx="40" cy="72" r="23" fill="url(#head)" stroke="#3d3a30" stroke-width="4.5" transform="rotate(22 40 72)"/>
  <path d="M27 84 C 35 90 46 91 54 85" stroke="#56533f" stroke-width="2.2" fill="none"/>
  <circle cx="33" cy="62" r="2.6" fill="#5a5640" opacity="0.55"/>

  <!-- 昏沉眼 -->
  <g fill="#e6e2ce" stroke="#3d3a30" stroke-width="3">
    <ellipse cx="33" cy="68" rx="4.4" ry="6"/>
    <ellipse cx="48" cy="66" rx="3.8" ry="5.2"/>
  </g>
  <path d="M32 67 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <path d="M47 65 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <!-- 沮丧嘴 -->
  <path d="M33 86 Q 41 84 48 85" stroke="#3d3a30" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>