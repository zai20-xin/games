<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="40%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#a9a69a"/>
      <stop offset="55%" stop-color="#8a877a"/>
      <stop offset="100%" stop-color="#6b685f"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9a88"/>
      <stop offset="100%" stop-color="#7a7a6a"/>
    </linearGradient>
  </defs>

  <!-- 枯萎垂软茎（明显塌垂） -->
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#3d3a30" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 50 102 70 112 62 124" stroke="#7d7d6c" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 焦叶下垂卷边 -->
  <g stroke="#3d3a30" stroke-width="4">
    <ellipse cx="36" cy="117" rx="13" ry="5" fill="url(#leaf)" transform="rotate(74 36 117)"/>
    <ellipse cx="80" cy="118" rx="13" ry="5" fill="url(#leaf)" transform="rotate(112 80 118)"/>
  </g>
  <!-- 叶上焦斑 -->
  <circle cx="30" cy="113" r="3" fill="#5a5640" opacity="0.7"/>
  <circle cx="76" cy="114" r="2.6" fill="#5a5640" opacity="0.7"/>

  <!-- 塌顶芽（倒伏） -->
  <path d="M58 60 C 50 44 62 30 74 27" stroke="#3d3a30" stroke-width="9.5" fill="none" stroke-linecap="round"/>
  <path d="M58 60 C 50 44 62 30 74 27" stroke="#84846f" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- 下垂歪炮口（枪口朝地） -->
  <g stroke="#3d3a30" stroke-width="4.5" stroke-linejoin="round">
    <rect x="70" y="48" width="38" height="25" rx="13" fill="url(#head)" transform="rotate(24 88 60)"/>
    <ellipse cx="102" cy="73" rx="5.5" ry="12" fill="#5c5c52" transform="rotate(24 102 73)"/>
  </g>

  <!-- 垂头塌陷（明显低头 + 裂纹 + 干斑） -->
  <circle cx="55" cy="66" r="30" fill="url(#head)" stroke="#3d3a30" stroke-width="4.5" transform="rotate(18 55 66)"/>
  <path d="M38 80 C 47 87 60 90 72 83" stroke="#56533f" stroke-width="2.2" fill="none"/>
  <path d="M44 42 C 49 36 55 38 58 44" stroke="#56533f" stroke-width="2.2" fill="none"/>
  <circle cx="38" cy="60" r="3" fill="#5a5640" opacity="0.55"/>
  <circle cx="72" cy="72" r="2.4" fill="#5a5640" opacity="0.55"/>

  <!-- 昏沉克制的眼（半闭） -->
  <g fill="#e8e4d0" stroke="#3d3a30" stroke-width="3">
    <ellipse cx="48" cy="52" rx="5" ry="6"/>
    <ellipse cx="66" cy="50" rx="4.6" ry="5.6"/>
  </g>
  <path d="M47 51 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <path d="M65 49 q 2 -2 -1 -3" stroke="#3d3a30" stroke-width="2.4" fill="none"/>
  <!-- 下垂沮丧嘴 -->
  <path d="M52 74 Q 59 72 66 73" stroke="#3d3a30" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>