<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="petal" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </radialGradient>
    <radialGradient id="disc" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#a06f36"/>
      <stop offset="100%" stop-color="#6b4218"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83cf52"/>
      <stop offset="100%" stop-color="#4d9627"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M64 80 C 61 96 67 104 63 121" stroke="#26150a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M64 80 C 61 96 67 104 63 121" stroke="#5aa63a" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- leaves -->
  <g stroke="#26150a" stroke-width="4">
    <ellipse cx="44" cy="110" rx="15" ry="7" fill="url(#leaf)" transform="rotate(-24 44 110)"/>
    <ellipse cx="84" cy="107" rx="15" ry="7" fill="url(#leaf)" transform="rotate(18 84 107)"/>
  </g>

  <!-- petals -->
  <g stroke="#26150a" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(30 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(60 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(90 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(120 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(150 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(180 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(210 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(240 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(270 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(300 64 54)"/>
    <ellipse cx="64" cy="24" rx="10.5" ry="16" fill="url(#petal)" transform="rotate(330 64 54)"/>
  </g>

  <!-- face disc -->
  <circle cx="64" cy="54" r="25.5" fill="url(#disc)" stroke="#26150a" stroke-width="4.5"/>
  <circle cx="56" cy="48" r="3.4" fill="#20120a"/>
  <circle cx="72" cy="48" r="3.4" fill="#20120a"/>
  <path d="M53 59 Q 64 71 75 59 Q 64 65 53 59 Z" fill="#3a230e" stroke="#26150a" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="50.5" cy="56" r="3" fill="#e88a4a" opacity="0.55"/>
  <circle cx="77.5" cy="56" r="3" fill="#e88a4a" opacity="0.55"/>
</svg>
