<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#ffd95e"/>
      <stop offset="55%" stop-color="#e0a22e"/>
      <stop offset="100%" stop-color="#9c6b10"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3bf"/>
      <stop offset="60%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffb320"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b84e"/>
      <stop offset="100%" stop-color="#b5792b"/>
    </linearGradient>
  </defs>

  <!-- stem（青铜） -->
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#4a3a18" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#c9a04a" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- leaves（金叶） -->
  <g stroke="#4a3a18" stroke-width="4">
    <ellipse cx="39" cy="113" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(-22 39 113)"/>
    <ellipse cx="77" cy="110" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(16 77 110)"/>
  </g>

  <!-- 王冠 -->
  <g fill="#ffd94d" stroke="#7a5510" stroke-width="3" stroke-linejoin="round">
    <path d="M39 24 L43 10 L49 19 L55 7 L61 19 L67 10 L71 24 Z"/>
  </g>
  <g fill="#ffefca">
    <circle cx="43" cy="14" r="2.4"/>
    <circle cx="55" cy="11" r="2.4"/>
    <circle cx="67" cy="14" r="2.4"/>
  </g>

  <!-- 炮口（金箍） -->
  <g stroke="#4a3a18" stroke-width="4.5" stroke-linejoin="round">
    <rect x="72" y="43" width="42" height="28" rx="13.5" fill="url(#head)"/>
    <ellipse cx="112.5" cy="57" rx="7" ry="13.5" fill="#5c3c08"/>
  </g>
  <g fill="none" stroke="#7a5510" stroke-width="3">
    <path d="M78 45 C 80 56 80 58 78 69"/>
    <path d="M90 44 C 93 56 93 58 90 70"/>
  </g>

  <!-- 头部金甲 -->
  <circle cx="55" cy="58" r="31" fill="url(#head)" stroke="#4a3a18" stroke-width="4.5"/>
  <circle cx="55" cy="58" r="31" fill="none" stroke="#ffe9a8" stroke-width="1.6" opacity="0.7" stroke-dasharray="3 4"/>

  <!-- 能量核心眼 -->
  <g>
    <circle cx="49" cy="49" r="7.5" fill="#fff3bf"/>
    <circle cx="67" cy="47" r="7" fill="#fff3bf"/>
    <circle cx="51.2" cy="50" r="3.4" fill="url(#core)"/>
    <circle cx="68.8" cy="48" r="3.2" fill="url(#core)"/>
    <circle cx="50" cy="48.5" r="1.2" fill="#ffffff"/>
    <circle cx="67.5" cy="46.5" r="1.1" fill="#ffffff"/>
  </g>
  <path d="M50 70 Q 58 75 66 71" stroke="#4a3a18" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>