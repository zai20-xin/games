<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="head" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#7fd0f0"/>
      <stop offset="100%" stop-color="#3f9ad0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#aef0ff"/>
      <stop offset="100%" stop-color="#5cc4ee"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8fcff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#9fe8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aee4ff"/>
      <stop offset="100%" stop-color="#4f8fc0"/>
    </linearGradient>
  </defs>

  <!-- 极光冰晕 -->
  <circle cx="64" cy="54" r="40" fill="url(#halo)"/>

  <!-- 冰晶 stem -->
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#263a48" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M58 86 C 56 100 62 108 58 122" stroke="#82d8f0" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- leaves（冰晶叶） -->
  <g stroke="#263a48" stroke-width="4">
    <ellipse cx="39" cy="113" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(-22 39 113)"/>
    <ellipse cx="77" cy="110" rx="14" ry="6.5" fill="url(#leaf)" transform="rotate(16 77 110)"/>
  </g>

  <!-- 冰晶皇冠 -->
  <g fill="#eafcff" stroke="#6cb8dd" stroke-width="2.5" stroke-linejoin="round">
    <path d="M46 27 L50 12 L57 20 L63 6 L69 20 L76 12 L80 27 Z"/>
  </g>
  <g fill="#bdeeff">
    <path d="M57 22 L60 17 L63 22 Z"/>
    <path d="M63 17 L66 11 L69 17 Z"/>
    <path d="M50 24 L52 18 L55 24 Z"/>
    <path d="M73 19 L75 20 L77 19 Z"/>
  </g>
  <circle cx="50" cy="18" r="2" fill="#ffffff"/>
  <circle cx="63" cy="12" r="2" fill="#ffffff"/>
  <circle cx="76" cy="18" r="2" fill="#ffffff"/>

  <!-- 顶芽 + 冰晶簇 -->
  <path d="M52 34 C 50 22 56 14 62 13" stroke="#263a48" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M52 34 C 50 22 56 14 62 13" stroke="#9fe0ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <g fill="#eafcff" stroke="#6cb8dd" stroke-width="2" stroke-linejoin="round">
    <path d="M88 20 L92 30 L88 40 L84 30 Z"/>
    <path d="M102 32 L105 40 L102 48 L99 40 Z" opacity="0.9"/>
    <path d="M74 16 L78 24 L74 32 L70 24 Z" opacity="0.8"/>
  </g>

  <!-- 炮口（冰甲金箍→改为冰环） -->
  <g stroke="#263a48" stroke-width="4.5" stroke-linejoin="round">
    <rect x="72" y="43" width="42" height="28" rx="13.5" fill="url(#head)"/>
    <ellipse cx="112.5" cy="57" rx="7" ry="13.5" fill="#27648c"/>
  </g>
  <g fill="none" stroke="#bfefff" stroke-width="3">
    <path d="M78 45 C 80 56 80 58 78 69"/>
    <path d="M90 44 C 93 56 93 58 90 70"/>
  </g>
  <circle cx="119" cy="49" r="3.8" fill="#eafcff" opacity="0.9"/>
  <circle cx="124" cy="60" r="2.8" fill="#eafcff" opacity="0.6"/>

  <!-- 头部冰晶甲 -->
  <circle cx="55" cy="58" r="31" fill="url(#head)" stroke="#263a48" stroke-width="4.5"/>
  <circle cx="55" cy="58" r="31" fill="none" stroke="#d8f6ff" stroke-width="1.6" opacity="0.7" stroke-dasharray="3 4"/>

  <!-- 能量核心眼（冰蓝发光） -->
  <g>
    <circle cx="49" cy="49" r="7.5" fill="#eafcff"/>
    <circle cx="67" cy="47" r="7" fill="#eafcff"/>
    <circle cx="51.2" cy="50" r="3.4" fill="url(#core)"/>
    <circle cx="68.8" cy="48" r="3.2" fill="url(#core)"/>
    <circle cx="50" cy="48.5" r="1.2" fill="#ffffff"/>
    <circle cx="67.5" cy="46.5" r="1.1" fill="#ffffff"/>
  </g>
  <path d="M50 70 Q 58 75 66 71" stroke="#263a48" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>