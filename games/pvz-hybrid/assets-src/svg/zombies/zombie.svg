<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 锈骨外甲：暗枪灰金属，带病态冷光（实验体材质的基调） -->
    <radialGradient id="metal" cx="38%" cy="24%" r="90%">
      <stop offset="0%" stop-color="#4a515c"/>
      <stop offset="55%" stop-color="#2c313a"/>
      <stop offset="100%" stop-color="#191d23"/>
    </radialGradient>
    <!-- 头部外甲：更"污染"的暗灰绿，是病毒渗入的暗示 -->
    <radialGradient id="headcap" cx="40%" cy="26%" r="92%">
      <stop offset="0%" stop-color="#545d55"/>
      <stop offset="55%" stop-color="#343838"/>
      <stop offset="100%" stop-color="#1d211f"/>
    </radialGradient>
    <!-- 实验袍：灰白带苔藓污渍（实验室工人的职业叙事） -->
    <linearGradient id="coat" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#d6d8c8"/>
      <stop offset="55%" stop-color="#b5b9a6"/>
      <stop offset="100%" stop-color="#888d7b"/>
    </linearGradient>
    <!-- 病毒荧光（酸腐绿）：体内泄漏的核心 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#96ff60" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#5ccb3b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2f8f1f" stop-opacity="0"/>
    </radialGradient>
    <!-- 面屏（发光方形屏幕，代替皮肤） -->
    <radialGradient id="screen" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#232a33"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </radialGradient>
    <!-- 高光 -->
    <radialGradient id="gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面落影 -->
  <ellipse cx="68" cy="123" rx="33" ry="5" fill="#0000002e"/>

  <!-- 机械猫尾：从背面伸出，末端病毒荧光（Buddy 猫的标志性尾巴 → 化作残尾） -->
  <path d="M80 96 C 94 94 100 82 98 72" fill="none" stroke="#242a31" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 96 C 94 94 100 82 98 72" fill="none" stroke="#3a414b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="98" cy="71" r="4.4" fill="url(#glow)"/>

  <!-- ==== 后臂（右手，伸向左前=植物方向，机械钳手 + 发光肘关节） ==== -->
  <path d="M70 74 L 34 86" stroke="#181c22" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M70 74 L 34 86" stroke="#3c424c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="52" cy="80" r="4.4" fill="url(#glow)"/>
  <path d="M32 88 l -8 2 M34 90 l -9 6 M37 90 l -6 8" stroke="#181c22" stroke-width="4" stroke-linecap="round"/>

  <!-- ==== 后腿 ==== -->
  <path d="M70 102 L 77 118 L 89 115 L 85 100 Z" fill="#242a31" stroke="#181c22" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="79" cy="112" r="3.4" fill="url(#glow)"/>
  <ellipse cx="85" cy="119" rx="9.4" ry="4.5" fill="#31373f" stroke="#181c22" stroke-width="3"/>

  <!-- ==== 前腿（一只跛脚：下方脱线） ==== -->
  <path d="M52 102 L 48 120 L 60 121 L 66 100 Z" fill="#22272d" stroke="#181c22" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="54" cy="113" r="3.3" fill="url(#glow)"/>
  <ellipse cx="53" cy="123" rx="9.8" ry="4.8" fill="#2c323b" stroke="#181c22" stroke-width="3"/>
  <path d="M50 118 Q 46 122 48 126" stroke="#181c22" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ==== 颈：波纹线束（代替人体颈部） ==== -->
  <path d="M50 60 L 66 60 L 64 70 L 52 70 Z" fill="#161a1f" stroke="#0c0e12" stroke-width="2.6"/>
  <path d="M53 63 h11 M53 66 h11" stroke="#3a404a" stroke-width="1.6"/>

  <!-- ==== 躯干：小机器人本体 + 破实验袍 ==== -->
  <path d="M47 66 C 53 60 71 60 77 66 C 83 72 83 82 82 92 L 84 104 L 76 99 L 69 105 L 62 100 L 55 106 L 48 101 L 42 105 L 42 92 C 41 82 42 72 47 66 Z"
        fill="url(#coat)" stroke="#181c22" stroke-width="4" stroke-linejoin="round"/>
  <path d="M53 75 l 4 6 -3 3 -5 -4 Z" fill="#767c63" opacity="0.55"/>
  <path d="M70 84 q 3 4 0 7 q -3 -3 0 -7" fill="#6a7057" opacity="0.5"/>
  <rect x="52" y="63" width="22" height="7" rx="3" fill="#333a44" stroke="#181c22" stroke-width="2.5"/>
  <!-- 胸口：打开的面板，露出病毒荧光核心 + 电线 -->
  <path d="M58 76 l 9 -2 2 8 -9 3 Z" fill="#12151a" stroke="#0c0e12" stroke-width="2"/>
  <circle cx="62" cy="79" r="4" fill="url(#glow)"/>
  <path d="M62 74 l -3 -5 M62 84 l 2 5 M55 78 l -4 1" stroke="#1e2a20" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 胸口的生化警示标 -->
  <circle cx="79" cy="80" r="6" fill="#cfd3c4" stroke="#181c22" stroke-width="2"/>
  <path d="M79 76.6 v3 M79 81.2 v1.3" stroke="#3f7d3a" stroke-width="1.7"/>
  <path d="M50 102 l 10 -2" stroke="#96ff6055" stroke-width="2" stroke-linecap="round"/>

  <!-- ==== 前臂（左手，伸向植物方向） ==== -->
  <path d="M58 70 L 24 80" stroke="#181c22" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M58 70 L 24 80" stroke="#3c424c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="41" cy="76" r="4.2" fill="url(#glow)"/>
  <path d="M22 82 l -7 1 M25 83 l -8 5 M26 84 l -4 8" stroke="#181c22" stroke-width="4" stroke-linecap="round"/>

  <!-- ==== 头：圆润机器人 + 猫耳（Buddy 猫的基础造型，化作实验体遗骸） ==== -->
  <path d="M36 34 C 33 18 44 7 59 8 C 74 9 81 20 80 32 C 79 40 74 47 68 50 C 60 54 49 55 44 50 C 39 45 37 39 36 34 Z"
        fill="url(#headcap)" stroke="#181c22" stroke-width="4" stroke-linejoin="round"/>
  <!-- 猫耳：左耳带缺口、右耳带锈蚀 -->
  <path d="M40 16 L 45 3 L 55 12 Z" fill="#3a404a" stroke="#181c22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42 14 L 45.5 6.5 L 51 12 Z" fill="#6b6f7a" opacity="0.5"/>
  <path d="M66 12 L 78 4 L 76 18 Z" fill="#383d46" stroke="#181c22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M68 11.5 L 74 7 L 72 15 Z" fill="#6b6f7a" opacity="0.5"/>
  <!-- 头顶缺甲 + 荧光裂纹（病毒从缝隙外渗） -->
  <path d="M50 7 Q 58 4 66 7" fill="none" stroke="#0c0e12" stroke-width="2.6"/>
  <path d="M53 8 Q 58 14 55 18" fill="none" stroke="#96ff6088" stroke-width="2" stroke-linecap="round"/>
  <circle cx="58" cy="12" r="2" fill="url(#glow)"/>

  <!-- ==== 面屏（方形发光屏：Buddy 标志性"方脸屏" → 故障演死相） ==== -->
  <path d="M40 20 h 34 a 3 3 0 0 1 3 3 v 27 a 3 3 0 0 1 -3 3 h -34 a 3 3 0 0 1 -3 -3 v -27 a 3 3 0 0 1 3 -3 Z"
        fill="url(#screen)" stroke="#0c0e12" stroke-width="3" stroke-linejoin="round"/>
  <!-- 屏幕底部故障扫描线 -->
  <path d="M41 47 h 30 M45 50 h 18" stroke="#1d2830" stroke-width="1.4"/>
  <!-- 左眼：酸腐绿，一条竖条芯片坏死偏暗 -->
  <path d="M46 24 a 5 5 0 0 1 5 2.5 a 7 7 0 0 0 6 0 a 5 5 0 0 1 4.5 2 l -1 4 a 5 5 0 0 1 -1 2.8 a 8 8 0 0 1 -5 3.4 a 9 9 0 0 1 -6 -0.6 a 6 6 0 0 1 -3.2 -4.6 Z"
        fill="#1b211a" stroke="#0c0e12" stroke-width="1.6"/>
  <ellipse cx="51" cy="33" rx="5.4" ry="7" fill="#8dff5c" stroke="#0c0e12" stroke-width="2"/>
  <ellipse cx="53.6" cy="30" rx="2.2" ry="3.2" fill="#e1ffc8"/>
  <!-- 右眼：坏死暗红，故障闪烁 -->
  <path d="M58 24 a 5 5 0 0 1 5 3 a 7 7 0 0 0 6 0.6 a 5 5 0 0 1 4.5 2 l -1 4 a 6 6 0 0 1 -1 2.8 a 8 8 0 0 1 -5 3.4 a 9 9 0 0 1 -6 -0.6 a 6 6 0 0 1 -3 -4.6 Z"
        fill="#1b211a" stroke="#0c0e12" stroke-width="1.6"/>
  <ellipse cx="64" cy="33" rx="4.8" ry="6.4" fill="#6e2426" stroke="#0c0e12" stroke-width="2"/>
  <ellipse cx="63" cy="32" r="1.6" fill="#e8f3cd" opacity="0.9"/>
  <!-- 鼻梁呼吸灯 -->
  <rect x="60" y="33" width="4" height="6" rx="2" fill="#2c3f45" stroke="#0c0e12" stroke-width="1.5"/>
  <rect x="60" y="48" width="4" height="3" rx="1.5" fill="#23402f"/>
  <!-- 嘴：缺口式"屏幕裂纹"代替张嘴 -->
  <path d="M49 47 q 7 5 14 0" fill="none" stroke="#0c0e12" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M52 48.5 l 6 1.6 -3 3.2 Z" fill="#0c0e12"/>
  <!-- 面部挂痕 -->
  <path d="M42 33 l 3 -3 M68 49 l 3 -2" stroke="#0a0c10" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ==== 头后断裂天线（残线，末梢坏死荧光） ==== -->
  <path d="M84 26 q 8 5 6 14" fill="none" stroke="#181c22" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="40" r="2.6" fill="#5ccb3b" opacity="0.5"/>
</svg>